<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f24"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="line-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f5d4" stop-opacity=".2"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse-node{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.25);opacity:1}}@keyframes flow-line{0%{stroke-dashoffset:1000}}@keyframes float-card{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes wave-pulse{0%{opacity:.3;stroke-dashoffset:0}50%{opacity:.7;stroke-dashoffset:50}}.node{animation:pulse-node 4s ease-in-out infinite;transform-origin:center}.node-delay-1{animation-delay:1s}.node-delay-2{animation-delay:2s}.floating-pill{animation:float-card 5s ease-in-out infinite}.floating-pill-alt{animation:float-card 6s ease-in-out infinite;animation-delay:1.5s}.ecg-line{stroke-dasharray: