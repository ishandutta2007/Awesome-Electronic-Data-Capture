<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Title Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-card {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes wave-pulse {
      0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
      50% { opacity: 0.7; stroke-dashoffset: 50; }
    }

    .node { animation: pulse-node 4s ease-in-out infinite; transform-origin: center; }
    .node-delay-1 { animation-delay: 1s; }
    .node-delay-2 { animation-delay: 2s; }
    
    .floating-pill { animation: float-card 5s ease-in-out infinite; }
    .floating-pill-alt { animation: float-card 6s ease-in-out infinite; animation-delay: 1.5s; }

    .ecg-line {
      stroke-dasharray: 20 10;
      animation: wave-pulse 8s linear infinite;
    }

    /* Typography */
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Background Decorative Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- Animated ECG / Clinical Trial Waveform in Background -->
  <path class="ecg-line" d="M 50,280 Q 150,280 200,280 T 250,280 L 270,240 L 290,310 L 310,220 L 330,290 L 350,280 Q 450,280 600,280 T 800,280 L 820,250 L 840,300 L 860,230 L 880,280 T 1150,280" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" />

  <!-- Background Network Connections & Glowing Data Nodes -->
  <g opacity="0.4">
    <line x1="120" y1="80" x2="280" y2="130" stroke="url(#line-grad)" stroke-width="2"/>
    <line x1="280" y1="130" x2="420" y2="70" stroke="url(#line-grad)" stroke-width="1.5"/>
    <line x1="780" y1="80" x2="940" y2="140" stroke="url(#line-grad)" stroke-width="2"/>
    <line x1="940" y1="140" x2="1080" y2="75" stroke="url(#line-grad)" stroke-width="1.5"/>

    <circle cx="120" cy="80" r="6" fill="#00f5d4" class="node" filter="url(#soft-glow)"/>
    <circle cx="280" cy="130" r="8" fill="#6366f1" class="node node-delay-1" filter="url(#soft-glow)"/>
    <circle cx="420" cy="70" r="5" fill="#38bdf8" class="node node-delay-2" filter="url(#soft-glow)"/>
    <circle cx="780" cy="80" r="6" fill="#ec4899" class="node node-delay-1" filter="url(#soft-glow)"/>
    <circle cx="940" cy="140" r="7" fill="#818cf8" class="node" filter="url(#soft-glow)"/>
    <circle cx="1080" cy="75" r="5" fill="#00f5d4" class="node node-delay-2" filter="url(#soft-glow)"/>
  </g>

  <!-- Side Floating Feature Pills (Placed safely on sides) -->
  <g class="floating-pill">
    <rect x="50" y="45" width="160" height="34" rx="17" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="68" cy="62" r="5" fill="#38bdf8"/>
    <text x="83" y="66" class="pill-text">GCP Compliant 📋</text>
  </g>

  <g class="floating-pill-alt">
    <rect x="990" y="45" width="160" height="34" rx="17" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1008" cy="62" r="5" fill="#c084fc"/>
    <text x="1023" y="66" class="pill-text">21 CFR Part 11 🔒</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitle (Always 100% visible & sharp) -->
  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" class="banner-title" fill="url(#title-grad)" filter="url(#glow)">
    Awesome Electronic Data Capture
  </text>
  <!-- Main Title Crisp Overlay -->
  <text x="600" y="160" text-anchor="middle" class="banner-title" fill="url(#title-grad)">
    Awesome Electronic Data Capture
  </text>

  <!-- Subtitle -->
  <text x="600" y="202" text-anchor="middle" class="banner-subtitle">
    Curated Directory of EDC Platforms, eCRF Systems &amp; Clinical Trial Software Ecosystems
  </text>

  <!-- Bottom Feature Pill Badges Bar (Foreground) -->
  <g transform="translate(230, 245)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="23" text-anchor="middle" class="pill-text" fill="#38bdf8">🏥 SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="265" y="23" text-anchor="middle" class="pill-text" fill="#818cf8">💻 Open-Source Repos</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="455" y="23" text-anchor="middle" class="pill-text" fill="#c084fc">📊 CDISC Standards</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="650" y="23" text-anchor="middle" class="pill-text" fill="#34d399">🔬 Clinical Research</text>
  </g>
</svg>
